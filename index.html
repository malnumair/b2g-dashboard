<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B2G Dashboard — Aanaab</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="dash.css">
</head>
<body>
<div class="app">

  <!-- ===== Sidebar ===== -->
  <aside class="side">
    <div class="side__brand">
      <img src="assets/logo.svg" alt="Aanaab">
      <span class="yr">FY26</span>
    </div>
    <div class="side__scroll" id="navScroll"></div>
    <div class="side__foot">
      <span class="dot"></span>
      <span>Live · synced 2 min ago</span>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumb">Business Development</div>
        <h1 id="title">Executive Summary</h1>
      </div>
      <div class="topbar__spacer"></div>
      <div class="week-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Week <b>22</b> · <b>May 2026</b>
      </div>
      <div class="seg">
        <button class="active">2026</button>
        <button>2025</button>
        <button>All</button>
      </div>
      <button class="btn btn-ghost" id="btnBrief">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        Director's Briefing
      </button>
      <button class="btn btn-ghost" id="btnRefresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
      <button class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Add Opportunity
      </button>
    </header>

    <div class="canvas">
      <div id="viewHost"></div>
    </div>
  </main>
</div>

<!-- ===== Director's Briefing slide-over ===== -->
<div class="brief-scrim" id="briefScrim"></div>
<aside class="brief" id="brief" aria-hidden="true">
  <div class="brief__head">
    <span class="bi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
    <div>
      <h2>Director's Briefing</h2>
      <div class="meta" id="briefMeta">Week 22 · May 2026</div>
    </div>
    <button class="icon-btn x" id="briefClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="brief__body" id="briefBody"></div>
</aside>

<script src="data.js"></script>
<script src="charts.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
